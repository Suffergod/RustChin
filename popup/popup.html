<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RustChin</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="panel">

    <!-- Header -->
    <div class="header">
      <img class="logo" id="brandLogo" src="../icons/circleicon48.png" alt="RustChin">
      <div>
        <h1 data-i18n="name">RustChin</h1>
        <div class="subtitle" data-i18n="subtitle">RTL &amp; Persian Fonts for AI chat</div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn-icon" id="openDashboardBtn" title="Settings &amp; Dashboard" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><g><circle cx="12" cy="12" r="3"/><path d="M13.8 2.2C13.4 2 12.9 2 12 2s-1.4 0-1.8.2c-.5.2-.9.6-1.1 1.1-.1.2-.1.5-.2.9-.1.6-.4 1.1-.9 1.4-.5.3-1.1.3-1.6 0-.3-.2-.6-.3-.8-.3-.5-.1-1.1.1-1.5.4-.3.2-.6.6-1 1.4-.5.8-.7 1.2-.8 1.6-.1.5.1 1.1.4 1.5.1.2.3.4.7.6.5.3.8.8.8 1.4s-.3 1.1-.8 1.4c-.3.2-.5.4-.7.6-.3.4-.5 1-.4 1.5.1.4.3.8.8 1.6.5.8.7 1.2 1 1.4.4.3 1 .5 1.5.4.2 0 .5-.1.8-.3.5-.3 1.1-.3 1.6 0 .5.3.8.8.9 1.4.1.4.1.7.2.9.2.5.6.9 1.1 1.1.4.2.9.2 1.8.2s1.4 0 1.8-.2c.5-.2.9-.6 1.1-1.1.1-.2.1-.5.2-.9.1-.6.4-1.1.9-1.4.5-.3 1.1-.3 1.6 0 .3.2.6.3.8.3.5.1 1.1-.1 1.5-.4.3-.2.6-.6 1-1.4.5-.8.7-1.2.8-1.6.1-.5-.1-1.1-.4-1.5-.1-.2-.3-.4-.7-.6-.5-.3-.8-.8-.8-1.4s.3-1.1.8-1.4c.3-.2.5-.4.7-.6.3-.4.5-1 .4-1.5-.1-.4-.3-.8-.8-1.6-.5-.8-.7-1.2-1-1.4-.4-.3-1-.5-1.5-.4-.2 0-.5.1-.8.3-.5.3-1.1.3-1.6 0-.5-.3-.8-.8-.9-1.4-.1-.4-.1-.7-.2-.9-.2-.5-.6-.9-1.1-1.1z"/></g></svg>
        </button>
        <span class="ver" id="versionBadge">v1.2.0</span>
      </div>
    </div>

    <!-- Appearance + language -->
    <div class="prefs">
      <div class="seg" id="themeSeg" role="tablist" aria-label="Theme">
        <button type="button" class="seg-btn" data-value="auto" title="Auto">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><g><path d="M3 14V6C3 4.34315 4.34315 3 6 3H18C19.6569 3 21 4.34315 21 6V14C21 15.6569 19.6569 17 18 17H6C4.34315 17 3 15.6569 3 14Z"/><path d="M10 21H14M12 17V21" stroke-linecap="round"/></g></svg>
        </button>
        <button type="button" class="seg-btn" data-value="light" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><g><circle cx="12" cy="12" r="5"/><path d="M12 2V4M12 20V22M4 12L2 12M22 12L20 12M19.778 4.222L17.556 6.254M4.222 4.222L6.444 6.254M6.444 17.556L4.222 19.778M19.778 19.778L17.556 17.556" stroke-linecap="round"/></g></svg>
        </button>
        <button type="button" class="seg-btn" data-value="dark" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></g></svg>
        </button>
      </div>
      <div class="seg seg-text" id="langSeg" role="tablist" aria-label="Language">
        <button type="button" class="seg-btn" data-value="auto">Auto</button>
        <button type="button" class="seg-btn" data-value="en">EN</button>
        <button type="button" class="seg-btn" data-value="fa">فا</button>
      </div>
    </div>

    <!-- Font selection with dropdown popover -->
    <div class="font-row">
      <div class="font-meta">
        <svg class="font-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" x2="15" y1="20" y2="20"></line><line x1="12" x2="12" y1="4" y2="20"></line></svg>
        <span class="font-label" data-i18n="font">Font</span>
      </div>
      <div class="font-picker-wrapper" id="fontPicker">
        <button type="button" class="font-picker-btn" id="fontPickerBtn" aria-haspopup="listbox" aria-expanded="false">
          <span class="font-picker-current font-vazir" id="fontPickerCurrent">وزیرمتن</span>
          <svg class="font-picker-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div class="font-dropdown" id="fontDropdown" role="listbox" aria-label="Choose font">
          <div class="font-option active" data-value="vazirmatn" role="option" aria-selected="true">
            <div class="font-opt-main">
              <span class="font-opt-fa font-vazir">وزیرمتن</span>
              <span class="font-opt-en">Vazirmatn</span>
            </div>
            <span class="font-opt-badge" data-i18n="badgeStandard">Standard</span>
          </div>
          <div class="font-option" data-value="estedad" role="option" aria-selected="false">
            <div class="font-opt-main">
              <span class="font-opt-fa font-estedad">استعداد</span>
              <span class="font-opt-en">Estedad</span>
            </div>
            <span class="font-opt-badge" data-i18n="badgeModern">Modern</span>
          </div>
          <div class="font-option" data-value="sahel" role="option" aria-selected="false">
            <div class="font-opt-main">
              <span class="font-opt-fa font-sahel">ساحل</span>
              <span class="font-opt-en">Sahel</span>
            </div>
            <span class="font-opt-badge" data-i18n="badgeClean">Clean</span>
          </div>
          <div class="font-option" data-value="arad" role="option" aria-selected="false">
            <div class="font-opt-main">
              <span class="font-opt-fa font-arad">آراد</span>
              <span class="font-opt-en">Arad</span>
            </div>
            <span class="font-opt-badge" data-i18n="badgeGeometric">Geometric</span>
          </div>
          <div class="font-option" data-value="mikhak" role="option" aria-selected="false">
            <div class="font-opt-main">
              <span class="font-opt-fa font-mikhak">میخک</span>
              <span class="font-opt-en">Mikhak</span>
            </div>
            <span class="font-opt-badge" data-i18n="badgeCasual">Casual</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Master toggle -->
    <div class="master">
      <div>
        <div class="master-label" id="masterLabel" data-i18n="enable">Enabled</div>
        <div class="master-status on" id="masterStatus">5/5 sites enabled</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="masterToggle" checked aria-label="Toggle RustChin globally">
        <span class="slider"></span>
      </label>
    </div>

    <!-- Reload hint for pre-install / pre-update tabs -->
    <div class="reload-hint" id="reloadHint" data-i18n="reloadHint"></div>

    <!-- Sites -->
    <div class="sites">
      <div class="section-title" data-i18n="supported">Supported sites</div>
      <div id="sitesList"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <span class="zero-badge" title="RustChin never reads, stores, or transmits your conversations.">
        <svg class="zero-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2L4 6V12.5C4 17.5 7.4 21.2 12 22C16.6 21.2 20 17.5 20 12.5V6L12 2Z"/>
          <path d="M9 12L11 14L15 10"/>
        </svg>
        <span data-i18n="zeroData">Zero data collected</span>
      </span>
      <div class="footer-actions">
        <a href="#" id="rateLink" class="footer-btn" title="Rate on Chrome Web Store" aria-label="Rate" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <g>
              <polygon points="12 2.5 14.13 9.06 21.04 9.06 15.45 13.12 17.58 19.69 12 15.63 6.42 19.69 8.55 13.12 2.96 9.06 9.87 9.06"/>
            </g>
          </svg>
        </a>
        <a href="#" id="reportLink" class="footer-btn" title="Report Issue" aria-label="Report" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <g>
              <path d="M9 8.5V6.5C9 4.843 10.343 3.5 12 3.5C13.657 3.5 15 4.843 15 6.5V8.5"/>
              <path d="M6 12.5C6 9.186 8.686 6.5 12 6.5C15.314 6.5 18 9.186 18 12.5V14.5C18 17.814 15.314 20.5 12 20.5C8.686 20.5 6 17.814 6 14.5V12.5Z"/>
              <path d="M4 7.5L7 9.5"/>
              <path d="M4 13.5H7"/>
              <path d="M4 19.5L7 17.5"/>
              <path d="M20 7.5L17 9.5"/>
              <path d="M20 13.5H17"/>
              <path d="M20 19.5L17 17.5"/>
            </g>
          </svg>
        </a>
      </div>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
